<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TECH.C AI Assistant</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
background:#050816;
background:
radial-gradient(circle at top left,#00e5ff22,transparent 30%),
radial-gradient(circle at bottom right,#0066ff22,transparent 40%),
#050816;
color:white;
height:100vh;
display:flex;
flex-direction:column;
}

.header{
padding:20px;
text-align:center;
border-bottom:1px solid rgba(0,229,255,.2);
}

.header h1{
color:#00e5ff;
font-size:28px;
}

.header p{
color:#aaa;
margin-top:5px;
}

.chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.message{
max-width:85%;
padding:14px;
border-radius:18px;
line-height:1.6;
}

.ai{
background:#111827;
align-self:flex-start;
}

.user{
background:#00e5ff;
color:#000;
align-self:flex-end;
}

.input-area{
display:flex;
gap:10px;
padding:10px;
background:#081221;
}

input{
flex:1;
padding:14px;
border:none;
border-radius:30px;
font-size:16px;
}

button{
padding:14px 20px;
border:none;
border-radius:30px;
background:#00e5ff;
font-weight:bold;
cursor:pointer;
}

.quick-buttons{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:15px;
}

.quick-buttons button{
background:#111827;
border:1px solid #00e5ff;
color:white;
}

</style>
</head>

<body>

<div class="header">
<h1>🤖 TECH.C AI</h1>
<p>学校案内アシスタント β版</p>
</div>

<div class="quick-buttons">

<button onclick="quickAsk('学費')">
学費
</button>

<button onclick="quickAsk('学科')">
学科
</button>

<button onclick="quickAsk('入試')">
入試
</button>

<button onclick="quickAsk('オープンキャンパス')">
OC
</button>

</div>

<div class="chat" id="chat">

<div class="message ai">
こんにちは😊<br><br>
TECH.Cについて質問してください。
</div>

</div>

<div class="input-area">

<input
id="question"
placeholder="質問を入力してください">

<button onclick="sendMessage()">
送信
</button>

</div>

<script>

/***********************************
FAQデータベース
ここに追加していくだけ
***********************************/

const faq = [

{
keywords:[
"学費",
"授業料",
"費用",
"お金",
"年間費用",
"学納金"
],
answer:`
TECH.Cの学費については
最新の募集要項をご確認ください。

https://www.tech.ac.jp/
`
},

{
keywords:[
"学科",
"専攻",
"コース",
"どんな学科",
"学べる分野"
],
answer:`
ゲーム・AI・IT・esports・CG・
デザイン・映像などを学べます。
`
},

{
keywords:[
"ai",
"人工知能",
"生成ai",
"chatgpt",
"aiエンジニア"
],
answer:`
AI分野では生成AIや
機械学習に関する技術を学べます。
`
},

{
keywords:[
"ゲーム",
"ゲーム業界",
"ゲーム制作",
"ゲームプログラマー",
"ゲームクリエイター"
],
answer:`
ゲーム制作に関連する
様々な専攻があります。
`
},

{
keywords:[
"入試",
"ao",
"総合型選抜",
"推薦",
"一般入学"
],
answer:`
総合型選抜（AO）、
推薦入学、
一般入学などがあります。
`
},

{
keywords:[
"オープンキャンパス",
"oc",
"学校見学",
"体験入学"
],
answer:`
オープンキャンパスは
定期開催されています。

詳しくは公式サイトを
ご確認ください。
`
},

{
keywords:[
"就職",
"就職率",
"キャリア",
"就職サポート"
],
answer:`
TECH.Cでは就職サポート制度が
用意されています。
`
}

];

/***********************************
メッセージ追加
***********************************/

function addMessage(text,type){

const chat =
document.getElementById("chat");

const div =
document.createElement("div");

div.className =
"message " + type;

div.innerHTML =
text.replace(/\n/g,"<br>");

chat.appendChild(div);

chat.scrollTop =
chat.scrollHeight;

}

/***********************************
FAQ検索
***********************************/

function findAnswer(question){

question =
question.toLowerCase();

for(const item of faq){

for(const keyword of item.keywords){

if(
question.includes(
keyword.toLowerCase()
)
){

return item.answer;

}

}

}

return `
申し訳ありません。

まだその質問の回答は
登録されていません。

今後順次追加予定です。
`;

}

/***********************************
送信処理
***********************************/

const input =
document.getElementById("question");

input.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){
sendMessage();
}

}
);

function sendMessage(){

const text =
input.value.trim();

if(text==="") return;

addMessage(text,"user");

input.value="";

setTimeout(function(){

addMessage(
findAnswer(text),
"ai"
);

},500);

}

function quickAsk(text){

input.value=text;

sendMessage();

}

</script>

</body>
</html>
