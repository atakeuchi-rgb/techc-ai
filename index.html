<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TECH.C AI Assistant</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#050816;
color:white;
height:100vh;
display:flex;
flex-direction:column;
}

.header{
padding:20px;
text-align:center;
border-bottom:1px solid #00e5ff50;
}

.header h1{
color:#00e5ff;
}

.header p{
color:#aaa;
margin-top:5px;
}

.chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.message{
padding:12px 16px;
border-radius:18px;
max-width:80%;
line-height:1.6;
}

.ai{
background:#111827;
align-self:flex-start;
}

.user{
background:#00e5ff;
color:black;
align-self:flex-end;
}

.input-area{
display:flex;
padding:10px;
gap:10px;
background:#081221;
}

input{
flex:1;
padding:14px;
border:none;
border-radius:30px;
font-size:16px;
}

button{
padding:14px 18px;
border:none;
border-radius:30px;
background:#00e5ff;
font-weight:bold;
cursor:pointer;
}

.quick{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:15px;
}

.quick button{
background:#111827;
color:white;
border:1px solid #00e5ff;
}

</style>
</head>

<body>

<div class="header">
<h1>🤖 TECH.C AI</h1>
<p>学校案内アシスタント β版</p>
</div>

<div class="quick">

<button onclick="quickAsk('学費')">学費</button>
<button onclick="quickAsk('学科')">学科</button>
<button onclick="quickAsk('入試')">入試</button>
<button onclick="quickAsk('オープンキャンパス')">OC</button>

</div>

<div class="chat" id="chat">

<div class="message ai">
こんにちは😊<br>
TECH.Cについて質問してください！
</div>

</div>

<div class="input-area">

<input
id="question"
placeholder="知りたいことを入力">

<button onclick="sendMessage()">
送信
</button>

</div>

<script>

const database = {

学費:
`TECH.Cの学費については、
最新の募集要項をご確認ください。

https://www.tech.ac.jp`,

学科:
`ゲーム、esports、AI、
ITプログラミング、CG、
デザイン、映像など
多彩な専攻があります。`,

入試:
`総合型選抜（AO入学）、
推薦入学、
一般入学などがあります。`,

オープンキャンパス:
`体験授業付きの
オープンキャンパスを
定期開催しています。`

};

const input =
document.getElementById("question");

input.addEventListener("keydown",(e)=>{

if(e.key==="Enter"){
sendMessage();
}

});

function addMessage(text,type){

const chat =
document.getElementById("chat");

const div =
document.createElement("div");

div.className =
"message " + type;

div.innerHTML =
text.replace(/\n/g,"<br>");

chat.appendChild(div);

chat.scrollTop =
chat.scrollHeight;

}

function findAnswer(question){

question = question.toLowerCase();

if(question.includes("学費"))
return database.学費;

if(question.includes("学科"))
return database.学科;

if(question.includes("入試"))
return database.入試;

if(question.includes("オープンキャンパス"))
return database.オープンキャンパス;

if(question.includes("oc"))
return database.オープンキャンパス;

return `
申し訳ありません。

まだデータが登録されていません。

今後AI化してTECH.Cサイトから
自動回答できるようにします。
`;

}

function sendMessage(){

const text =
input.value.trim();

if(text==="") return;

addMessage(text,"user");

input.value="";

setTimeout(()=>{

addMessage(
findAnswer(text),
"ai"
);

},500);

}

function quickAsk(text){

input.value=text;

sendMessage();

}

</script>

</body>
</html>
