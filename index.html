<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TECH.C AI Assistant</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
background:#050816;
background:
radial-gradient(circle at top left,#00e5ff22,transparent 30%),
radial-gradient(circle at bottom right,#0066ff22,transparent 40%),
#050816;
color:white;
height:100vh;
display:flex;
flex-direction:column;
}

.header{
padding:20px;
text-align:center;
border-bottom:1px solid rgba(0,229,255,0.2);
backdrop-filter:blur(10px);
}

.logo{
font-size:30px;
margin-bottom:8px;
}

.header h1{
color:#00e5ff;
font-size:26px;
font-weight:700;
}

.header p{
color:#aaa;
font-size:14px;
}

.cards{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:15px;
}

.card{
background:rgba(255,255,255,.05);
border:1px solid rgba(0,229,255,.3);
border-radius:15px;
padding:15px;
text-align:center;
cursor:pointer;
}

.card:hover{
border-color:#00e5ff;
}

.card span{
font-size:30px;
display:block;
margin-bottom:8px;
}

.chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.message{
max-width:85%;
padding:14px;
border-radius:18px;
line-height:1.6;
}

.ai{
background:#111827;
align-self:flex-start;
}

.user{
background:#00e5ff;
color:black;
align-self:flex-end;
}

.input-area{
display:flex;
gap:10px;
padding:12px;
background:#081221;
}

input{
flex:1;
padding:14px;
border:none;
border-radius:30px;
font-size:16px;
}

button{
background:#00e5ff;
border:none;
border-radius:30px;
padding:14px 20px;
font-weight:bold;
cursor:pointer;
}

.footer{
text-align:center;
padding:10px;
font-size:12px;
color:#777;
}

</style>
</head>

<body>

<div class="header">

<div class="logo">🤖</div>

<h1>TECH.C AI</h1>

<p>学校案内アシスタント β版</p>

</div>

<div class="cards">

<div class="card" onclick="quickAsk('ゲーム')">
<span>🎮</span>
ゲーム
</div>

<div class="card" onclick="quickAsk('AI')">
<span>🤖</span>
AI
</div>

<div class="card" onclick="quickAsk('IT')">
<span>💻</span>
IT
</div>

<div class="card" onclick="quickAsk('デザイン')">
<span>🎨</span>
デザイン
</div>

</div>

<div class="chat" id="chat">

<div class="message ai">
こんにちは😊<br><br>

TECH.Cについて質問してください。<br><br>

例
<ul>
<li>学費は？</li>
<li>AI専攻について</li>
<li>オープンキャンパスは？</li>
<li>ゲーム業界を目指したい</li>
</ul>

</div>

</div>

<div class="input-area">

<input
id="question"
placeholder="質問を入力してください">

<button onclick="sendMessage()">
送信
</button>

</div>

<div class="footer">
TECH.C AI Assistant Prototype
</div>

<script>

const answers = {

"ゲーム":
"ゲーム制作やゲームプログラマーを目指せる専攻があります。",

"AI":
"AIエンジニアやデータサイエンス分野を学べる専攻があります。",

"IT":
"プログラミングやシステム開発について学べる専攻があります。",

"デザイン":
"CG、グラフィック、映像制作などの分野があります。",

"学費":
"最新の学費はTECH.C公式サイトをご確認ください。",

"オープンキャンパス":
"オープンキャンパスは定期開催されています。",

"入試":
"AO・推薦・一般入学などがあります。AOエントリーは早期入試スタイルで、高校生/留学生/社会人の方対象となります。"

};

const input =
document.getElementById("question");

input.addEventListener("keydown",(e)=>{

if(e.key==="Enter"){
sendMessage();
}

});

function addMessage(text,type){

const chat =
document.getElementById("chat");

const msg =
document.createElement("div");

msg.className =
"message " + type;

msg.innerHTML =
text;

chat.appendChild(msg);

chat.scrollTop =
chat.scrollHeight;
}

function searchAnswer(text){

for(let key in answers){

if(text.includes(key)){
return answers[key];
}

}

return "ありがとうございます。今後AI機能を追加予定です。";
}

function sendMessage(){

const text =
input.value.trim();

if(text==="") return;

addMessage(text,"user");

input.value="";

setTimeout(()=>{

addMessage(
searchAnswer(text),
"ai"
);

},500);

}

function quickAsk(text){

input.value=text;

sendMessage();

}

</script>

</body>
</html>
