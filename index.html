<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TECH.C AI</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <h1>🤖 TECH.C AI</h1>
    <p>学校案内アシスタント</p>

    <button class="admin-btn" onclick="showLogin()">
        ⚙️
    </button>
</header>

<main class="chat" id="chat">

    <div class="message ai">
        こんにちは😊<br>
        TECH.Cについて質問してください。
    </div>

</main>

<div class="input-area">

    <input
        id="question"
        type="text"
        placeholder="質問を入力してください">

    <button onclick="sendMessage()">
        送信
    </button>

</div>

<!-- ログイン -->

<div id="loginModal" class="modal">

    <div class="modal-content">

        <h2>管理者ログイン</h2>

        <input
            id="password"
            type="password"
            placeholder="パスワード">

        <button onclick="login()">
            ログイン
        </button>

        <button onclick="closeLogin()">
            閉じる
        </button>

    </div>

</div>

<!-- 管理画面 -->

<div id="adminModal" class="modal">

    <div class="modal-content">

        <h2>FAQ管理</h2>

        <input
            id="keywords"
            placeholder="学費,授業料,年間費用">

        <textarea
            id="answer"
            rows="5"
            placeholder="回答を入力"></textarea>

        <button onclick="saveFaq()">
            保存
        </button>

        <button onclick="logoutAdmin()">
            ログアウト
        </button>

        <hr>

        <div id="faqList"></div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
